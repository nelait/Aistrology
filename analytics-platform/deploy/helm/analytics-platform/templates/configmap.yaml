{{- $cloud := include "ap.cloud" . -}}
{{- if and (hasKey .Values.env "AP_DEV_AUTH") (ne $cloud "local") }}
{{- fail "env.AP_DEV_AUTH must not be set unless cloud=local (dev-only auth stub)" }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.fullname" . }}-env
  labels:
    {{- include "ap.labels" . | nindent 4 }}
data:
  AP_CLOUD_PROVIDER: {{ $cloud | quote }}
  {{- range $k, $v := .Values.env }}
  {{- if and (ne $k "AP_CLOUD_PROVIDER") (ne (toString $v) "") }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
