{{- if and (eq (include "ap.cloud" .) "gcp") .Values.gcp.backendConfig.enabled }}
# GKE Ingress backend settings: Cloud Armor (WAF) policy + health check.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "ap.fullname" . }}-api
  labels:
    {{- include "ap.labels" . | nindent 4 }}
spec:
  {{- with .Values.gcp.backendConfig.securityPolicy }}
  securityPolicy:
    name: {{ . }}
  {{- end }}
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: {{ .Values.api.containerPort }}
  connectionDraining:
    drainingTimeoutSec: 30
{{- end }}
