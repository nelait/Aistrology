{{- if .Values.serviceAccount.create -}}
{{- $cloud := include "ap.cloud" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ap.serviceAccountName" . }}
  labels:
    {{- include "ap.labels" . | nindent 4 }}
  annotations:
    {{- if eq $cloud "gcp" }}
    iam.gke.io/gcp-service-account: {{ required "serviceAccount.gcpServiceAccount is required when cloud=gcp" .Values.serviceAccount.gcpServiceAccount | quote }}
    {{- else if eq $cloud "aws" }}
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.awsRoleArn is required when cloud=aws" .Values.serviceAccount.awsRoleArn | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
