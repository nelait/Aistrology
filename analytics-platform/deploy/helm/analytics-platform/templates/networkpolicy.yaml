{{- if .Values.networkPolicy.enabled }}
# Default deny for every pod of this release (ingress and egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-default-deny
  labels:
    {{- include "ap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ap.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
---
# Ingress: only the API port on the API pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-api-ingress
  labels:
    {{- include "ap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.apiIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Egress: DNS, HTTPS (cloud APIs, LLM providers) and Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-egress
  labels:
    {{- include "ap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ap.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Egress"]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
