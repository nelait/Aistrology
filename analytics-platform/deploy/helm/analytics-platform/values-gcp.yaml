# GKE overlay. Fill the blanks from `terraform output` in infra/terraform/envs/gcp-prod.
cloud: gcp

image:
  repository: us-central1-docker.pkg.dev/my-org-analytics-prod/analytics-prod-images/backend

serviceAccount:
  # terraform output workload_identity_service_account
  gcpServiceAccount: analytics-prod-app@my-org-analytics-prod.iam.gserviceaccount.com

env:
  AP_OBJECT_BUCKET: my-org-analytics-prod-analytics-prod-datasets
  AP_SECRET_PREFIX: analytics
  AP_JWT_SECRET_NAME: jwt-signing-key # secret id analytics--platform--jwt-signing-key
  AP_GCP_PROJECT: my-org-analytics-prod
  AP_GCP_LOCATION: us-central1
  AP_GCP_KMS_KEY: projects/my-org-analytics-prod/locations/us-central1/keyRings/analytics-prod-keyring/cryptoKeys/analytics-prod-data
  AP_GCP_PUBSUB_TOPIC: analytics-prod-jobs
  AP_GCP_PUBSUB_SUBSCRIPTION: analytics-prod-jobs-worker

secretEnv:
  existingSecret: analytics-platform-secrets # holds AP_DATABASE_URL

ingress:
  className: gce
  host: api.analytics.example.com
  annotations:
    kubernetes.io/ingress.allow-http: "false"
    # Google-managed certificate instead of a TLS secret:
    # networking.gke.io/managed-certificates: analytics-platform-cert
  tls:
    enabled: true
    secretName: analytics-platform-tls

gcp:
  backendConfig:
    enabled: true
    securityPolicy: analytics-prod-waf # terraform output security_policy_name

networkPolicy:
  extraEgress:
    # GKE metadata server (Workload Identity token exchange).
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - port: 988
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
          protocol: TCP
