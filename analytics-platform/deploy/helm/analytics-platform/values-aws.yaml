# EKS overlay. Fill the blanks from `terraform output` in infra/terraform/envs/aws-prod.
# Requires the AWS Load Balancer Controller in the cluster.
cloud: aws

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/analytics-prod/backend

serviceAccount:
  # terraform output irsa_role_arn
  awsRoleArn: arn:aws:iam::123456789012:role/analytics-prod-app

env:
  AP_OBJECT_BUCKET: analytics-prod-datasets-xxxxxxxx
  AP_SECRET_PREFIX: analytics
  AP_JWT_SECRET_NAME: jwt-signing-key # secret analytics/platform/jwt-signing-key
  AP_AWS_REGION: us-east-1
  AP_AWS_KMS_KEY_ID: arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000000
  AP_AWS_SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/analytics-prod-jobs

secretEnv:
  existingSecret: analytics-platform-secrets # holds AP_DATABASE_URL

ingress:
  className: alb
  host: api.analytics.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # terraform output waf_acl_arn
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:123456789012:regional/webacl/analytics-prod-waf/00000000-0000-0000-0000-000000000000
  tls:
    enabled: true
    secretName: "" # TLS terminates at the ALB (ACM certificate above)

networkPolicy:
  extraEgress: []
