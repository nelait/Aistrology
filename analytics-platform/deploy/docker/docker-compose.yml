# Local development stack: API + Postgres 16 (+ optional separate worker).
#
#   docker compose -f analytics-platform/deploy/docker/docker-compose.yml up --build
#   open http://localhost:8000/docs
#
# By default the API runs jobs in-process (AP_INLINE_WORKER=1). To exercise
# the separate worker process as in Kubernetes:
#
#   AP_INLINE_WORKER=0 docker compose -f analytics-platform/deploy/docker/docker-compose.yml \
#     --profile worker up --build
#
# AP_CLOUD_PROVIDER=local: datasets live on the shared `ap-data` volume
# (no MinIO / cloud emulators needed). The dev auth stub is enabled here
# only; AP_DEV_AUTH must never be set in prod.

name: analytics-platform

x-backend: &backend
  build:
    context: ../../backend
    dockerfile: ../deploy/docker/Dockerfile
  image: analytics-platform:dev
  environment: &backend-env
    AP_CLOUD_PROVIDER: local
    AP_DEV_AUTH: "1"
    AP_DATA_DIR: /data
    AP_INLINE_WORKER: ${AP_INLINE_WORKER:-1}
    AP_DATABASE_URL: postgresql+psycopg://analytics:analytics@postgres:5432/analytics
    AP_SECRET_PREFIX: analytics
    AP_JWT_SECRET_NAME: jwt-signing-key
  volumes:
    - ap-data:/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    profiles: ["worker"]
    environment:
      <<: *backend-env
      AP_INLINE_WORKER: "0"
    command: ["python", "-m", "app.jobs.worker"]
    healthcheck:
      disable: true

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics # local dev only
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ap-data:
  pg-data:
