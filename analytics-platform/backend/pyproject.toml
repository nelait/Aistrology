[project]
name = "analytics-platform-backend"
version = "0.1.0"
description = "Analytics Platform backend: schemas, sample data, ingestion, profiling, sandboxed SQL, LLM-assisted analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "anthropic>=1.0",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.7",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=41",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    "skops>=0.10",
    "catboost>=1.2",
    "statsmodels>=0.14",
    "skl2onnx>=1.17",
    "onnxmltools>=1.12",
    "defusedxml>=0.7",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # Phase 2 data layer: legacy Excel, Avro, fuzzy matching, encoding detection
    "xlrd>=2.0",
    "fastavro>=1.9",
    "rapidfuzz>=3.6",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
gcp = ["google-cloud-storage>=2.16", "google-cloud-secret-manager>=2.20", "google-cloud-kms>=2.21", "google-cloud-pubsub>=2.21"]
aws = ["boto3>=1.34"]
# ING-007 connectors: MySQL driver (PostgreSQL uses psycopg; S3/GCS use the aws/gcp extras)
connectors = ["pymysql>=1.1", "boto3>=1.34", "google-cloud-storage>=2.16"]
dev = ["pytest>=8", "ruff>=0.6", "onnxruntime>=1.17", "moto[s3,secretsmanager,kms,sqs]>=5.0", "boto3>=1.34", "google-cloud-storage>=2.16", "google-cloud-secret-manager>=2.20", "google-cloud-kms>=2.21", "google-cloud-pubsub>=2.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI dependency defaults
    "B905",   # zip() over equal-length vectorized draws
    "E501",   # line length is owned by `ruff format`
    "UP042",  # (str, Enum) keeps pydantic/JSON behaviour explicit
]
